Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.

name: CloudStream Derleyici

"on":
workflow_dispatch:
push:
branches:
- master
paths-ignore:
- "/*.md"
- "/.yml"
- "**/.jpg"
- "/*.png"
- "/*.py"

permissions:
contents: write

concurrency:
group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
cancel-in-progress: true

jobs:
CloudStreamDerleyici:
runs-on: ubuntu-latest

steps:
  - name: Kaynak depoyu indir
    uses: actions/checkout@v4
    with:
      path: src

  - name: builds dalını indir
    uses: actions/checkout@v4
    with:
      ref: builds
      path: builds
      fetch-depth: 0

  - name: JDK 17 kur
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Gradle önbelleğini ayarla
    uses: gradle/actions/setup-gradle@v4

  - name: Eklentileri derle
    shell: bash
    run: |
      set -euo pipefail
      cd "$GITHUB_WORKSPACE/src"
      chmod +x gradlew
      ./gradlew make makePluginsJson

      test -f build/plugins.json

      find . -type f -name "*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
      cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

  - name: builds dalına yayınla
    shell: bash
    run: |
      set -euo pipefail
      cd "$GITHUB_WORKSPACE/builds"

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "Yayınlanacak değişiklik yok."
        exit 0
      fi

      git commit -m "CloudStream eklentilerini güncelle"
      git push origin HEAD:builds
