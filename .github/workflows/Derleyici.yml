name: CloudStream Derleyici

concurrency:
group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
cancel-in-progress: true

on:
workflow_dispatch:
push:
branches:
- master
paths-ignore:
- "/*.md"
- "/.yml"
- "**/.jpg"
- "/*.png"
- "/*.py"

permissions:
contents: write

jobs:
CloudStreamDerleyici:
runs-on: ubuntu-latest

steps:
  - name: Kaynak Depoyu Kontrol Et
    uses: actions/checkout@v4
    with:
      path: src

  - name: Derleme Deposunu Kontrol Et
    uses: actions/checkout@v4
    with:
      ref: builds
      path: builds
      fetch-depth: 0

  - name: JDK 17 Ayarla
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Gradle Önbelleği
    uses: gradle/actions/setup-gradle@v4

  - name: Eklentileri Derle ve JSON Oluştur
    run: |
      set -e
      cd "$GITHUB_WORKSPACE/src"
      chmod +x gradlew
      ./gradlew make makePluginsJson

      mkdir -p "$GITHUB_WORKSPACE/builds"
      find . -type f -name "*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;

      test -f build/plugins.json
      cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

  - name: Derlemeleri builds Dalına Yükle
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      set -e
      cd "$GITHUB_WORKSPACE/builds"

      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git config user.name "github-actions[bot]"

      git add -A

      if git diff --cached --quiet; then
        echo "Yayınlanacak değişiklik yok."
        exit 0
      fi

      git commit -m "CloudStream eklentilerini güncelle"
      git push origin HEAD:builds
